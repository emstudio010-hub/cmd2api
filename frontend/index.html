<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <title>cmd2api 管理后台</title>

    <!-- 站点图标。favicon.ico 内含 16/32/48/64 四种尺寸，浏览器自行挑；
         另给一张 PNG 供不支持 ico 的场合，以及 iOS 加到主屏时用的图。 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b1b1f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <script>
      // 在首屏绘制前定好主题，避免刷新时闪一下另一种配色。
      // 深色是默认值：只有显式选过浅色才切到 light 类。
      try {
        if (localStorage.getItem('cmd2api.theme') === 'light') {
          document.documentElement.classList.remove('dark')
          document.documentElement.classList.add('light')
        }
      } catch (e) {
        /* 隐私模式下 localStorage 会抛错，忽略即可 */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
